plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Стандартный Maven Central (для jankson и системных утилит)
	mavenCentral()

	// Официальный репозиторий Fabric
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mogdops-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	// Fabric Loader & Fabric API
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Библиотека JSON5-парсера для owo-config (скачивается с mavenCentral за секунду без прокси)
	implementation "blue.endless:jankson:1.2.3"

	// Все локальные моды из папки 'libs' (owo-lib, worldedit, modmenu и др.)
	modImplementation fileTree(dir: 'libs', include: ['*.jar'])
	annotationProcessor fileTree(dir: 'libs', include: ['*.jar'])
	clientAnnotationProcessor fileTree(dir: 'libs', include: ['*.jar'])
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}