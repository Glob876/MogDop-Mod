plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Официальный репозиторий Fabric
	maven { url 'https://maven.fabricmc.net/' }
	maven { url 'https://maven.wispforest.io/releases/' }
	maven { url 'https://maven.terraformersmc.com/releases/' }
	// Репозиторий Modrinth Maven (WorldEdit)
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	// Репозиторий CurseMaven (Запасной зеркальный репозиторий)
	maven {
		name = "CurseMaven"
		url = "https://www.cursemaven.com"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mogdops-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	// ВАЖНОЕ ИСПРАВЛЕНИЕ: Двоеточие между net.fabricmc и fabric-loader
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Подключение owo-lib
	modImplementation "io.wispforest:owo-lib:${project.owo_version}"
	// Включение owo-sentinel (автоматически предложит скачать библиотеку игроку, если её нет)
	include "io.wispforest:owo-sentinel:${project.owo_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// ПОДКЛЮЧЕНИЕ ОБРАБОТЧИКА АННОТАЦИЙ owo-config В ОСНОВНОЙ СЕТ
	annotationProcessor "io.wispforest:owo-lib:${project.owo_version}"

	// Подключение WorldEdit Fabric 1.21.1 через Modrinth Maven
	modImplementation "maven.modrinth:worldedit:7.3.8"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}