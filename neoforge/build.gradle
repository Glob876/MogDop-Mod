plugins {
    id "com.github.johnrengelman.shadow"
    id "dev.architectury.loom"
    id "architectury-plugin"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    silentMojangMappingsLicense()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"

    // ИСПРАВЛЕНИЕ: NeoForge ОБЯЗАН использовать официальные маппинги от Mojang!
    mappings loom.officialMojangMappings()

    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    // WorldEdit и остальные libs — как implementation, но FABRIC-ONLY моды исключаем (otherwise Scanning Mod Candidates виснет)
    implementation fileTree(dir: "${rootProject.projectDir}/libs", include: ['*.jar'], exclude: ['architectury-*-fabric.jar', 'architectury-plugin*.jar', 'owo-lib*.jar', 'modmenu*.jar'])
    annotationProcessor fileTree(dir: "${rootProject.projectDir}/libs", include: ['*.jar'], exclude: ['architectury-*-fabric.jar', 'architectury-plugin*.jar', 'owo-lib*.jar', 'modmenu*.jar'])
    // Правильный Architectury для NeoForge — с maven
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    implementation "blue.endless:jankson:1.2.3"
    implementation "io.wispforest:endec:0.1.5"
    implementation "io.wispforest.endec:netty:0.1.2"
    implementation "io.wispforest.endec:gson:0.1.3"
    implementation "io.wispforest.endec:jankson:0.1.3"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}