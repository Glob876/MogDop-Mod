plugins {
    id "com.github.johnrengelman.shadow"
    id "dev.architectury.loom"
    id "architectury-plugin"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    silentMojangMappingsLicense()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    modImplementation fileTree(dir: "${rootProject.projectDir}/libs", include: ['*.jar'])
    annotationProcessor fileTree(dir: "${rootProject.projectDir}/libs", include: ['*.jar'])

    implementation "blue.endless:jankson:1.2.3"
    implementation "io.wispforest:endec:0.1.5"
    implementation "io.wispforest.endec:netty:0.1.2"
    implementation "io.wispforest.endec:gson:0.1.3"
    implementation "io.wispforest.endec:jankson:0.1.3"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}