plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1" apply false
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")

    // Локальные моды и библиотеки из папки libs
    modImplementation fileTree(dir: "${rootProject.projectDir}/libs", include: ['*.jar'])
    annotationProcessor fileTree(dir: "${rootProject.projectDir}/libs", include: ['*.jar'])

    implementation "blue.endless:jankson:1.2.3"
    implementation "io.wispforest:endec:0.1.5"
    implementation "io.wispforest.endec:netty:0.1.2"
    implementation "io.wispforest.endec:gson:0.1.3"
    implementation "io.wispforest.endec:jankson:0.1.3"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}