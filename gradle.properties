# Фиксируем Java 21 для Gradle (Gradle 8.13 не поддерживает Java 25 — падает с major version 69)
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk

# ================= НАСТРОЙКИ SOCKS5 ПРОКСИ =================
# По умолчанию прокси отключен для runClient (раскомментируй если нужен socks5)
# Используй HTTP_PROXY (10809) для Gradle — socksProxy ломает NeoForge загрузку
# systemProp.socksProxyHost=127.0.0.1
# systemProp.socksProxyPort=10808
systemProp.java.net.useSystemProxies=true

