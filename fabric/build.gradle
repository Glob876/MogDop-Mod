plugins {
    id "dev.architectury.loom"
    id "architectury-plugin"
    id "com.github.johnrengelman.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    silentMojangMappingsLicense()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }

    modImplementation fileTree(dir: "${rootProject.projectDir}/libs", include: ['*.jar'])
    annotationProcessor fileTree(dir: "${rootProject.projectDir}/libs", include: ['*.jar'])

    implementation "blue.endless:jankson:1.2.3"
    implementation "io.wispforest:endec:0.1.5"
    implementation "io.wispforest.endec:netty:0.1.2"
    implementation "io.wispforest.endec:gson:0.1.3"
    implementation "io.wispforest.endec:jankson:0.1.3"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}